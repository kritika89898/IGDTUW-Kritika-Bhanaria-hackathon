<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">SignalScope architecture</title>
  <desc id="desc">React and TypeScript interface calls a Node and TypeScript server, which retrieves source records from news, SEC, GDELT, Yahoo Finance, and Alpha Vantage and returns provider facts separately from analysis.</desc>
  <defs><style>.bg{fill:#f4f7fa}.box{fill:#fff;stroke:#b8c7d6;stroke-width:2;rx:18}.source{fill:#edf6f4;stroke:#83b8aa;stroke-width:2;rx:16}.out{fill:#f3efff;stroke:#a697cf;stroke-width:2;rx:16}.title{font:700 30px Arial;fill:#182c3b}.head{font:700 22px Arial;fill:#193344}.txt{font:18px Arial;fill:#40576a}.small{font:15px Arial;fill:#536b7f}.arrow{stroke:#627d90;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6 1 11" fill="none" stroke="#627d90" stroke-width="2"/></marker></defs>
  <rect class="bg" width="1500" height="760"/><text x="70" y="70" class="title">SignalScope · system architecture</text>
  <rect class="box" x="80" y="250" width="300" height="220"/><text x="110" y="300" class="head">Web application</text><text x="110" y="345" class="txt">React · TypeScript · Vite</text><text x="110" y="380" class="txt">Overview · events · companies</text><text x="110" y="415" class="txt">Scenarios · methodology</text>
  <rect class="box" x="500" y="205" width="400" height="310"/><text x="540" y="260" class="head">Node server</text><text x="540" y="305" class="txt">Provider adapters and normalization</text><text x="540" y="345" class="txt">Deduplication · risk analysis</text><text x="540" y="385" class="txt">Freshness and error states</text><text x="540" y="425" class="txt">API routes · source provenance</text><text x="540" y="475" class="small">Secrets stay in server environment</text>
  <rect class="source" x="1080" y="120" width="330" height="80"/><text x="1110" y="168" class="head">NewsAPI-compatible</text><rect class="source" x="1080" y="225" width="330" height="80"/><text x="1110" y="273" class="head">SEC EDGAR</text><rect class="source" x="1080" y="330" width="330" height="80"/><text x="1110" y="378" class="head">GDELT DOC 2.0</text><rect class="source" x="1080" y="435" width="330" height="80"/><text x="1110" y="483" class="head">Yahoo Finance · quotes</text><rect class="source" x="1080" y="540" width="330" height="80"/><text x="1110" y="588" class="head">Alpha Vantage · daily history</text>
  <rect class="out" x="500" y="600" width="400" height="100"/><text x="540" y="642" class="head">Provider facts + analysis</text><text x="540" y="674" class="small">Separate provenance, indicators, and estimates</text>
  <path class="arrow" d="M380 360H490"/><text x="397" y="340" class="small">HTTP</text><path class="arrow" d="M900 270C970 250 970 160 1070 160"/><path class="arrow" d="M900 315H1070"/><path class="arrow" d="M900 360H1070"/><path class="arrow" d="M900 405H1070"/><path class="arrow" d="M900 450C980 480 980 580 1070 580"/><path class="arrow" d="M700 515V590"/><path class="arrow" d="M500 650C430 640 430 470 380 440"/><text x="410" y="610" class="small">JSON responses</text>
</svg>
